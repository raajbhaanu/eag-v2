<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trip Reality Check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>Trip Reality Check <span class="badge">AGENT</span></h3>
  <label>Gemini API key (auto-filled from .env)</label>
  <input id="apiKey" type="password" placeholder="AIza...">
  <label>Your trip</label>
  <textarea id="query" rows="3">I'm flying from Paris to Tokyo for 5 days next week. My budget is 1500 EUR. Can I afford it and what should I pack?</textarea>
  <button id="go">Check my trip</button>
  <div id="steps"></div>
  <div id="final" class="hidden"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
